# Central configuration. Every tunable choice lives here, not in code,
# so experiments (e.g. different chunk sizes) are a config change.

govuk:
  base_url: "https://www.gov.uk"
  request_delay_seconds: 0.5     # be polite to a public API
  timeout_seconds: 20
  # Content formats we keep. Others (forms, news, transactions) are noise for Q&A.
  allowed_formats: ["answer", "guide", "detailed_guide"]

# Curated corpus: topic label -> GOV.UK pages.
# Why curated, not crawled: v1 auto-discovered pages via search and pulled in
# off-topic content (visas, driving tests, emergency recovery = ~40% of chunks).
# GOV.UK's own topic tags were too inconsistent to filter on, so pages are
# hand-labelled. These labels also train the step-4 topic classifier.
corpus:
  sick_leave:
    - /statutory-sick-pay
    - /taking-sick-leave
  family_leave:
    - /maternity-pay-leave
    - /employers-maternity-pay-leave
    - /paternity-pay-leave
    - /shared-parental-leave-and-pay
    - /shared-parental-leave-and-pay-employer-guide
    - /parental-leave
  holidays_and_time_off:
    - /holiday-entitlement-rights
    - /time-off-for-dependants
    - /parental-bereavement-pay-leave
    - /employers-parental-bereavement-pay-leave
  working_hours_and_flexibility:
    - /flexible-working
    - /maximum-weekly-working-hours
    - /rest-breaks-work
  pay_and_pensions:
    - /national-minimum-wage
    - /pay-and-work-rights
    - /workplace-pensions
  contracts_and_status:
    - /employment-contracts-and-conditions
    - /contract-types-and-employer-responsibilities
    - /employment-status
    - /agency-workers-your-rights
    - /working-retirement-pension-age
  dismissal_and_redundancy:
    - /dismissal
    - /redundancy-your-rights
    - /lay-offs-short-timeworking
  disputes_and_whistleblowing:
    - /solve-workplace-dispute
    - /whistleblowing
  discrimination_and_disability:
    - /discrimination-your-rights
    - /employer-preventing-discrimination
    - /reasonable-adjustments-for-disabled-workers
    - /access-to-work
    - /rights-disabled-person
    - /guidance/equality-act-2010-guidance

# Used only by scripts/discover.py, which suggests NEW pages for a human to
# review and add to the corpus above. Nothing is auto-included.
discovery:
  search_queries:
    - "employee rights sick pay"
    - "workplace stress employer duty"
    - "flexible working request"
    - "holiday pay entitlement"
    - "redundancy pay rights"
    - "unfair dismissal"
    - "workplace discrimination"
    - "reasonable adjustments disability work"
    - "parental leave pay"
    - "working time rest breaks"
  results_per_query: 10

chunking:
  max_words: 200        # ~260 tokens: small enough for precise retrieval
  overlap_words: 40     # keeps sentences that straddle a boundary findable
  min_words: 50         # sections smaller than this merge with their neighbours

paths:
  raw_dir: data/raw
  processed_dir: data/processed
